name: Deploy to FastVPS (SSH)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Webpack project
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FASTVPS_SSH_KEY }}

      - name: Get server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 ${{ secrets.FASTVPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to FastVPS via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FASTVPS_HOST }}
          username: ${{ secrets.FASTVPS_USER }}
          port: 22
          source: "./dist/"
          target: "/var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma"
          strip_components: 1

      - name: Restart nginx
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.FASTVPS_HOST }}
          username: ${{ secrets.FASTVPS_USER }}
          port: 22
          script: |
            sudo nginx -t && sudo systemctl reload nginx
