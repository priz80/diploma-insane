name: Deploy to FastVPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Webpack project
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FASTVPS_SSH_KEY }}

      - name: Get server host key
        run: |
          ssh-keyscan -p 22 ${{ secrets.FASTVPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH
        run: |
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -p 22 ${{ secrets.FASTVPS_USER }}@${{ secrets.FASTVPS_HOST }} "echo OK && pwd"

      - name: Deploy main site
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -p 22" ./dist/ ${{ secrets.FASTVPS_USER }}@${{ secrets.FASTVPS_HOST }}:/var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma/

      - name: Deploy admin
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -p 22" ./admin/ ${{ secrets.FASTVPS_USER }}@${{ secrets.FASTVPS_HOST }}:/var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma/admin/

      - name: Deploy db and server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -p 22" ./db/ ${{ secrets.FASTVPS_USER }}@${{ secrets.FASTVPS_HOST }}:/var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma/db/
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -p 22" ./server.js ${{ secrets.FASTVPS_USER }}@${{ secrets.FASTVPS_HOST }}:/var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma/

      - name: Setup JSON Server with PM2
        run: |
          ssh -o StrictHostKeyChecking=no -p 22 ${{ secrets.FASTVPS_USER }}@${{ secrets.FASTVPS_HOST }} "
            cd /var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma
            npm install json-server --production
            pm2 delete json-server 2>/dev/null || true
            pm2 start server.js --name json-server
            pm2 save
            pm2 startup
          "

      - name: Deploy nginx config
        run: |
          ssh -o StrictHostKeyChecking=no -p 22 ${{ secrets.FASTVPS_USER }}@${{ secrets.FASTVPS_HOST }} "
            cp /tmp/nginx.conf /etc/nginx/sites-available/diploma 2>/dev/null || true
            rm -f /etc/nginx/sites-enabled/default
            ln -sf /etc/nginx/sites-available/diploma /etc/nginx/sites-enabled/diploma 2>/dev/null || true
          "

      - name: Restart nginx
        run: |
          ssh -o StrictHostKeyChecking=no -p 22 ${{ secrets.FASTVPS_USER }}@${{ secrets.FASTVPS_HOST }} "sudo nginx -t && sudo systemctl reload nginx"


          