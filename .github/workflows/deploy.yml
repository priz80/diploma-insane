name: Deploy Webpack Project (FTPS)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Webpack project
        run: npm run build

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: pagelist_ru_usr
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps                       # Принудительно включаем защищенный FTPS
          security: loose                      # Отключаем строгую проверку SSL хостинга
          local-dir: ./dist/
          server-dir: ./data/www/pagelist.ru/diploma/
