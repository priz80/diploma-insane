name: Deploy to FastVPS (SSH)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Webpack project
        run: npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.FASTVPS_HOST }}
          username: ${{ secrets.FASTVPS_USER }}
          key: ${{ secrets.FASTVPS_SSH_KEY }}
          port: 22
          script: |
            # Создаём директорию если нет
            mkdir -p /var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma/dist
            
            # Копируем файлы через rsync
            rsync -avz --delete ./dist/ /var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma/
            
            # Перезапускаем nginx
            sudo nginx -t && sudo systemctl reload nginx
