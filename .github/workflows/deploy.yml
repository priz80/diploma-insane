name: Deploy to FastVPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Webpack project
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FASTVPS_SSH_KEY }}

      - name: Get server host key
        run: |
          ssh-keyscan -p 22 ${{ secrets.FASTVPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH
        run: |
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -p 22 ${{ secrets.FASTVPS_USER }}@${{ secrets.FASTVPS_HOST }} "echo OK && pwd"

      - name: Deploy
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -p 22" ./dist/ root@${{ secrets.FASTVPS_HOST }}:/var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma/

      - name: Restart nginx
        run: |
          ssh -o StrictHostKeyChecking=no -p 22 ${{ secrets.FASTVPS_USER }}@${{ secrets.FASTVPS_HOST }} "sudo nginx -t && sudo systemctl reload nginx"
