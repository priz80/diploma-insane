server {
    listen 80;
    server_name diploma-insane.pagelist.ru;
    root /var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma;
    index index.html;
    charset utf-8;

    # Логирование
    access_log /var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma/logs/access.log;
    error_log /var/www/pagelist_ru_usr/data/www/pagelist.ru/diploma/logs/error.log;

    # Основные настройки
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Не кешировать HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Глобблы
    location ~ /\. {
        deny all;
    }
}
